<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>会话归档</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --surface: #101010;
        --hover: #181818;
        --text: #ededed;
        --muted: #969696;
        --border: #242424;
        --anthropic: #d97757;
        --openai: #e6e6e9;
        --blue: #8caacb;
        --other: #767676;
        --success: #85b99c;
        --danger: #e58b82;
        --purple: #b09bc7;
        --shadow: #0008;
        --overlay: #000e;
      }
      * { box-sizing: border-box; }
      a { color: var(--text); }
      button, input, select, textarea { font: inherit; color: var(--text); }
      input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
      button:hover, a:hover { color: var(--text); background: var(--hover); }
      :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1500px;
        margin: auto;
        padding: 20px;
      }
      h1 {
        margin: 0 0 16px;
      }
      .cards,
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card,
      .panel {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
      }
      .card {
        min-width: 150px;
      }
      .num {
        font-size: 24px;
        font-weight: 700;
      }
      .filters {
        margin: 14px 0;
      }
      .filters label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filters select,
      .filters input,
      button {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }
      button {
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--bg);
      }
      th,
      td {
        padding: 16px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }
      tr:hover {
        background: var(--hover);
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      .drawer {
        position: fixed;
        inset: 0 0 0 32%;
        background: var(--bg);
        box-shadow: -4px 0 20px var(--shadow);
        padding: 20px;
        overflow: auto;
        display: none;
      }
      .drawer.open {
        display: block;
      }
      .route-page {
        display: none;
        min-height: 100vh;
        background: var(--bg);
        padding: 24px;
        box-sizing: border-box;
      }
      .route-page.open {
        display: block;
      }
      .route-shell {
        max-width: 1500px;
        margin: auto;
      }
      .back-button {
        background: var(--blue);
        color: var(--bg);
        border-color: var(--blue);
        font-weight: 700;
        padding: 9px 14px;
      }
      .back-button:hover {
        background: var(--blue);
      }
      .request-list-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin: 10px 0;
        cursor: pointer;
      }
      .request-list-item:hover {
        border-color: var(--blue);
        box-shadow: 0 2px 8px var(--shadow);
      }
      .turn-card {
        display: grid;
        gap: 12px;
        margin: 12px 0;
        cursor: pointer;
      }
      .turn-card:hover {
        border-color: var(--blue);
        box-shadow: 0 2px 8px var(--shadow);
      }
      .turn-primary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }
      .turn-primary > section {
        min-width: 0;
      }
      .turn-primary h3 {
        margin: 0 0 7px;
        font-size: 13px;
        color: var(--muted);
      }
      .turn-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
        max-height: 13em;
        overflow: hidden;
      }
      .turn-text-detail {
        max-height: none;
      }
      .turn-final {
        border-left: 4px solid var(--success);
        padding-left: 12px;
      }
      .placeholder-text {
        color: var(--muted);
        opacity: 1;
        font-style: italic;
      }
      .process-step {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        margin: 10px 0;
        overflow: hidden;
      }
      .process-step > summary {
        cursor: pointer;
        padding: 11px 13px;
        font-weight: 650;
        background: var(--surface);
      }
      .process-step-body {
        padding: 12px;
        display: grid;
        gap: 9px;
      }
      .process-loading {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        opacity: 0.75;
      }
      .process-loading .spinner {
        width: 18px;
        height: 18px;
        border-width: 3px;
      }
      .tool-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 9px 11px;
      }
      .tool-summary button {
        flex: none;
      }
      @media (max-width: 800px) {
        .turn-primary {
          grid-template-columns: 1fr;
        }
      }
      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--overlay);
        place-items: center;
      }
      .loading-overlay.open {
        display: grid;
      }
      .loading-box {
        width: min(760px, calc(100vw - 40px));
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 4px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loading-sql {
        margin-top: 12px;
        max-height: 160px;
        background: var(--surface);
        color: var(--text);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .full-content {
        margin-top: 8px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--surface);
        color: var(--text);
        padding: 12px;
        border-radius: 8px;
        max-height: 45vh;
        overflow: auto;
      }
      .login {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: grid;
        place-items: center;
      }
      .login-card {
        width: min(440px, calc(100vw - 32px));
        display: grid;
        gap: 18px;
      }
      .login-brand {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .02em;
      }
      .login-card h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 38px);
        font-weight: 650;
        letter-spacing: -.035em;
        line-height: 1.1;
      }
      .login-hint {
        margin: -6px 0 10px;
        color: var(--muted);
        line-height: 1.6;
      }
      .login-field {
        display: grid;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
      }
      .login-field input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        font-size: 15px;
        font-weight: 400;
        border-radius: 8px;
        background: var(--surface);
      }
      .login-field input:focus {
        outline: none;
        border-color: var(--muted);
      }
      .login-submit {
        height: 44px;
        margin-top: 6px;
        border: 0;
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        font-weight: 650;
        cursor: pointer;
      }
      .login-submit:hover {
        background: #fff;
        color: var(--bg);
      }
      .login-card .error:empty {
        display: none;
      }
      .facet-more {
        max-height: 220px;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
      }
      .filter-head,
      .filter-actions,
      .active-filters {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-head {
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .filter-head input {
        min-width: 280px;
      }
      .facet-groups {
        display: grid;
        gap: 10px;
      }
      .facet-group {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }
      .facet-group summary {
        cursor: pointer;
        font-weight: 650;
      }
      .facet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 9px;
        margin-top: 9px;
      }
      .facet-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .facet-grid select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }
      .filter-head input,
      .filter-actions input {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }
      .filter-actions {
        margin-top: 12px;
      }
      .active-filters {
        margin: 8px 0;
      }
      .chip {
        background: var(--surface);
        color: var(--blue);
        border-radius: 999px;
        padding: 4px 9px;
      }
      .facet-meta {
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .facet-badges {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .facet-badges span {
        background: var(--surface);
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 12px;
      }
      .app-layout {
        display: grid;
        grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--bg);
        padding: 16px;
      }
      .sidebar > details {
        position: sticky;
        top: 16px;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }
      .sidebar summary {
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        padding: 8px 2px 14px;
      }
      .content {
        min-width: 0;
        padding: 24px;
      }
      .content header h1 {
        margin-bottom: 4px;
      }
      .cards {
        margin: 18px 0;
      }
      .card {
        flex: 1;
        min-width: 170px;
      }
      .sessions-panel {
        padding: 0;
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .section-head h2 {
        margin: 0;
        font-size: 17px;
      }
      .table-wrap {
        overflow: auto;
      }
      tbody tr {
        cursor: pointer;
      }
      .conversation-title {
        font-weight: 650;
        max-width: min(680px, 48vw);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .key-pill,
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 8px;
        background: var(--surface);
        font-size: 12px;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filter-head input {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }
      .facet-grid {
        grid-template-columns: 1fr;
      }
      .facet-group {
        background: var(--bg);
      }
      .filter-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .filter-actions label {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .filter-actions input {
        width: 72px;
      }
      .drawer {
        position: static;
        inset: auto;
        box-shadow: none;
        overflow: visible;
      }
      .drawer-head {
        position: sticky;
        top: -20px;
        padding: 12px 0;
        background: var(--bg);
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      .request-card {
        margin: 12px 0;
      }
      .request-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .request-preview {
        content-visibility: auto;
        contain-intrinsic-size: 600px;
      }
      .conversation-stream {
        display: grid;
        gap: 10px;
        margin: 12px 0;
      }
      .message-bubble {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--surface);
      }
      .message-bubble.user {
        border-left: 4px solid var(--blue);
        background: var(--surface);
      }
      .message-bubble.assistant {
        border-left: 4px solid var(--success);
        background: var(--surface);
      }
      .message-bubble.tool {
        border-left: 4px solid var(--anthropic);
        background: var(--surface);
      }
      .message-bubble.compaction {
        border-left: 4px solid var(--purple);
        background: var(--surface);
      }
      .message-role {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .message-text {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
      }
      .context-summary {
        color: var(--muted);
        background: var(--surface);
        border-radius: 8px;
        padding: 8px 10px;
        margin: 8px 0;
      }
      .technical-meta {
        margin: 8px 0;
      }
      .technical-meta dl {
        display: grid;
        grid-template-columns: minmax(130px, 220px) 1fr;
        gap: 5px 12px;
      }
      .technical-meta dt {
        color: var(--muted);
      }
      .technical-meta dd {
        margin: 0;
        word-break: break-word;
      }
      .raw-diagnostics {
        margin-top: 8px;
      }
      .request-snippet {
        margin-top: 8px;
        color: var(--text);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .response-snippet {
        margin-top: 6px;
        color: var(--success);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
      }
      .pagination button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .pagination input {
        width: 72px;
        text-align: center;
      }
      .kind-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 700;
        background: var(--surface);
        color: var(--blue);
        margin-right: 8px;
      }
      .kind-badge.compaction {
        background: var(--surface);
        color: var(--purple);
      }
      .kind-badge.retry {
        background: var(--surface);
        color: var(--anthropic);
      }
      .kind-badge.history_snapshot,
      .kind-badge.context_rebuild {
        background: var(--surface);
        color: var(--blue);
      }
      .download-notice {
        display: none;
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .download-notice.open {
        display: block;
      }
      .download-notice a {
        font-weight: 700;
        word-break: break-all;
      }
      .system-context {
        margin: 10px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--surface);
      }
      .system-context summary {
        cursor: pointer;
        font-weight: 700;
      }
      .system-context pre {
        max-height: 65vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .export-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .export-controls select {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }
      .diagnostic-grid,
      .tool-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 10px;
        margin: 12px 0;
      }
      .diagnostic-card,
      .tool-card {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        background: var(--bg);
      }
      .diagnostic-card h3,
      .tool-card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .diagnostic-card p,
      .tool-card p {
        margin: 5px 0;
      }
      .diagnostic-card button,
      .tool-card button {
        margin-top: 8px;
        color: var(--blue);
        border-color: var(--border);
      }
      .diagnostic-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .diagnostic-content {
        max-height: calc(100vh - 260px);
        min-height: 320px;
      }
      .status-success {
        color: var(--success);
      }
      .status-error {
        color: var(--danger);
      }
      @media (max-width: 900px) {
        .app-layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .sidebar > details {
          position: static;
          max-height: none;
        }
        .drawer {
          inset: 0;
        }
        .content {
          padding: 14px;
        }
      }
      .external-import { background: var(--surface); color: var(--blue); }
      .external-sources { margin-bottom: 18px; }
      .external-sources summary { cursor: pointer; }
      .external-source { border-top: 1px solid var(--border); padding: 16px 0; }
      .external-source summary, .external-source dd, .native-event-meta { overflow-wrap: anywhere; }
      .external-source dl { display: grid; grid-template-columns: minmax(90px, 130px) minmax(0, 1fr); gap: 8px; }
      .external-source dt, .external-source dd { margin: 0; }
      .native-event { margin: 12px 0; }

      .top-nav {
        display: flex; align-items: center; gap: 32px; padding: 0 32px;
        border-bottom: 1px solid var(--border); min-height: 64px;
      }
      .nav-brand { font-weight: 650; margin-right: 16px; }
      .top-nav a { text-decoration: none; color: var(--muted); padding: 20px 0; border-bottom: 2px solid transparent; }
      .top-nav a[aria-current="page"] { color: var(--text); border-color: var(--text); }
      .insights { max-width: 1600px; margin: auto; padding: 48px 40px 64px; }
      .insights-head { display: flex; justify-content: space-between; gap: 24px; align-items: start; }
      .insights h1 { font-size: clamp(28px, 3vw, 42px); font-weight: 650; letter-spacing: -.04em; margin-bottom: 8px; }
      .insights h2 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
      .insights-head p { margin: 0; }
      .window-control { display: flex; align-items: center; gap: 12px; flex: none; padding-top: 8px; }
      .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin: 48px 0 56px; }
      .kpi-number { font-size: clamp(40px, 5.6vw, 80px); line-height: 1.1; letter-spacing: -.05em; font-weight: 600; }
      .kpi-label { margin-top: 14px; font-size: 16px; font-weight: 650; }
      .kpi-note { color: var(--muted); margin-top: 3px; }
      .daily-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 20px 32px; }
      .provider-legend { display: flex; flex-wrap: wrap; gap: 20px; color: var(--muted); }
      .provider-legend b { color: var(--text); font-weight: 600; }
      .provider-dot { width: 7px; height: 7px; background: currentColor; border-radius: 50%; display: inline-block; flex: none; }
      .provider-anthropic { --provider: var(--anthropic); color: var(--anthropic); }
      .provider-openai { --provider: var(--openai); color: var(--openai); }
      .provider-google { --provider: var(--blue); color: var(--blue); }
      .provider-other { --provider: var(--other); color: var(--muted); }
      .legend-item { display: inline-flex; align-items: center; gap: 8px; }
      .daily-chart { width: 100%; display: block; margin-top: 24px; overflow: visible; }
      .daily-chart line { stroke: var(--border); stroke-width: 1; }
      .daily-chart text { fill: var(--muted); font: 12px system-ui; }
      .model-section { margin-top: 56px; }
      .model-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 36px; margin-top: 32px; }
      .metric-chart { min-width: 0; }
      .metric-chart h3 { font-size: 16px; font-weight: 600; margin: 0 0 20px; }
      .model-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(24px, 1fr) 58px; gap: 10px; align-items: center; margin: 12px 0; text-decoration: none; font-size: 13px; }
      .model-name { display: flex; gap: 7px; align-items: center; min-width: 0; }
      .model-name-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .model-bar { height: 9px; border-radius: 0 9px 9px 0; background: var(--provider); display: block; }
      .model-value { text-align: right; color: var(--muted); }
      .insights-footnote { max-width: 1080px; color: var(--muted); line-height: 1.8; margin: 42px 0 0; }
      .insights-status { padding: 48px 0; color: var(--muted); }
      .card { background: transparent; border: 0; border-right: 1px solid var(--border); border-radius: 0; padding: 8px 18px 8px 0; }
      .card:last-child { border-right: 0; }
      .num { font-size: 32px; font-weight: 600; }
      .cards { margin: 32px 0; }
      .sessions-panel { border-left: 0; border-right: 0; border-radius: 0; }
      .section-head { gap: 20px; flex-wrap: wrap; padding: 20px 0; }
      .back-button { background: var(--surface); color: var(--text); border-color: var(--border); }
      .back-button:hover { background: var(--hover); }
      .sidebar { padding: 24px 20px; }
      .facet-group { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 16px 0; }
      .facet-grid { gap: 16px; }
      .content { padding: 32px; }
      .drawer-head { flex-wrap: wrap; top: 0; }
      .process-step > summary .muted { margin-left: 8px; }
      .request-head, .tool-summary { flex-wrap: wrap; }
      .route-shell, .request-list-item > *, .tool-card, .diagnostic-card { min-width: 0; overflow-wrap: anywhere; }
      .source-search { width: min(480px, 100%); }
      #importedSources { padding: 16px; }
      .pagination { flex-wrap: wrap; }
      @media (max-width: 720px) {
        .top-nav { padding: 0 20px; gap: 24px; }
        .nav-brand { display: none; }
        .insights { padding: 28px 20px 48px; }
        .insights-head { flex-direction: column; gap: 16px; }
        .window-control { padding-top: 0; }
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 20px; margin: 32px 0 40px; }
        .kpi-number { font-size: 46px; }
        .kpi-label { font-size: 14px; }
        .kpi-note { font-size: 12px; }
        .provider-legend { gap: 10px 18px; font-size: 12px; }
        .model-grid { grid-template-columns: 1fr; gap: 28px; }
        .model-row { font-size: 13px; }
        .content, .route-page { padding: 20px; }
        .app-layout { min-height: auto; }
        .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .card { min-width: 0; padding-right: 4px; }
        .num { font-size: 22px; }
        .technical-meta dl { grid-template-columns: 1fr; }
        .technical-meta dd { margin-bottom: 8px; }
        .diagnostic-grid, .tool-grid { grid-template-columns: minmax(0, 1fr); }
        .conversation-title { max-width: 230px; }
        .table-wrap table { min-width: 680px; }
        .request-list-item { grid-template-columns: minmax(0, 1fr); }
      }

  <body>
    <nav class="top-nav" aria-label="Archive">
      <span class="nav-brand" data-i18n="title"></span>
      <a href="#/insights" data-i18n="insightsTab" id="insightsTab"></a>
      <a href="#/sessions" data-i18n="sessionsTab" id="sessionsTab"></a>
    </nav>
    <main id="insightsView" class="insights" hidden>
      <header class="insights-head">
        <div><h1 data-i18n="insightsTitle"></h1><p id="insightsGenerated" class="muted"></p></div>
        <label class="window-control"><span data-i18n="insightsWindow"></span>
          <select id="insightsDays" onchange="loadInsights()">
            <option value="7" data-i18n="days7"></option>
            <option value="30" data-i18n="days30" selected></option>
            <option value="90" data-i18n="days90"></option>
          </select>
        </label>
      </header>
      <div id="insightsContent" aria-live="polite"></div>
    </main>
    <div id="listView" class="app-layout" style="display:none">
      <aside class="sidebar">
        <details id="filterSidebar" open>
          <summary>
            <span data-i18n="facetedFilter"></span
            ><span id="activeCount" class="badge">0</span>
          </summary>
          <div class="filter-head">
            <input
              id="facetSearch"
              data-i18n-placeholder="facetSearchPlaceholder"
              oninput="filterFacetNames()"
            />
          </div>
          <div id="activeFilters" class="active-filters"></div>
          <div id="filters" class="facet-groups"></div>
          <div class="filter-actions">
            <label
              ><span data-i18n="limit"></span
              ><input id="limit" type="number" value="100" min="1" max="1000"
            /></label>
            <button data-i18n="apply" onclick="loadSessions()"></button>
            <button data-i18n="reset" onclick="resetFilters()"></button>
          </div>
        </details>
      </aside>
      <main class="content">
        <header>
          <h1 data-i18n="title">会话归档</h1>
          <p class="muted" data-i18n="subtitle"></p>
        </header>
        <div id="cards" class="cards"></div>
        <section class="panel sessions-panel">
          <div class="section-head">
            <h2 data-i18n="sessionsTitle"></h2>
            <div class="export-controls">
              <span id="resultCount" class="muted"></span
              ><button id="importedSourcesButton" data-i18n="importedSources" onclick="ExternalArchive.toggleSources(this)"></button
              ><select id="allExportFormat">
                <option value="archive" data-i18n="archiveFormat"></option>
                <option value="sft" data-i18n="sftFormat"></option></select
              ><button
                data-i18n="exportAll"
                onclick="downloadExport('all')"
              ></button>
            </div>
          </div>
          <div id="importedSources" hidden></div>
          <div id="allDownloadNotice" class="download-notice"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="columnConversation"></th>
                  <th data-i18n="columnKey"></th>
                  <th data-i18n="columnModel"></th>
                  <th data-i18n="columnRequests"></th>
                  <th data-i18n="columnLastActivity"></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="drawer" class="drawer route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToSessions"
            onclick="goSessions()"
          ></button>
          <div class="export-controls">
            <select id="sessionOrder" onchange="loadSessionPage(1)">
              <option value="desc" data-i18n="newestFirst"></option>
              <option value="asc" data-i18n="oldestFirst"></option></select
            ><select id="sessionExportFormat">
              <option value="archive" data-i18n="archiveFormat"></option>
              <option value="sft" data-i18n="sftFormat"></option></select
            ><button id="download" data-i18n="exportSession"></button>
          </div>
        </div>
        <h2 id="detailTitle"></h2>
        <p id="detailMeta" class="muted"></p>
        <div id="externalSources"></div>
        <div id="downloadNotice" class="download-notice"></div>
        <div id="detail"></div>
        <nav id="pagination" class="pagination">
          <button
            id="pageFirst"
            data-i18n="firstPage"
            onclick="goSessionPage(1)"
          ></button
          ><button
            id="pagePrevious"
            data-i18n="previousPage"
            onclick="changeSessionPage(-1)"
          ></button
          ><strong id="pageInfo"></strong
          ><label
            ><span data-i18n="jumpToPage"></span>
            <input
              id="pageJump"
              type="number"
              min="1"
              onchange="goSessionPage(this.value)"
              onkeydown="if(event.key==='Enter') goSessionPage(this.value)" /></label
          ><button
            id="pageNext"
            data-i18n="nextPage"
            onclick="changeSessionPage(1)"
          ></button
          ><button
            id="pageLast"
            data-i18n="lastPage"
            onclick="goLastSessionPage()"
          ></button>
        </nav>
      </div>
    </div>
    <div id="turnView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToSession"
            onclick="goSession()"
          ></button>
        </div>
        <h2 id="turnTitle"></h2>
        <p id="turnMeta" class="muted"></p>
        <div id="turnPrimary" class="panel turn-primary"></div>
        <h3 data-i18n="turnProcess"></h3>
        <p class="muted" data-i18n="turnProcessHint"></p>
        <div id="turnProcess"></div>
        <nav id="turnPagination" class="pagination">
          <button
            data-i18n="previousPage"
            onclick="changeTurnPage(-1)"
          ></button>
          <strong id="turnPageInfo"></strong>
          <button data-i18n="nextPage" onclick="changeTurnPage(1)"></button>
        </nav>
      </div>
    </div>
    <div id="requestView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToTurn"
            onclick="goParentFromRequest()"
          ></button>
        </div>
        <h2 id="requestTitle"></h2>
        <p id="requestMeta" class="muted"></p>
        <div id="requestDetail"></div>
      </div>
    </div>
    <div id="subDetailView" class="route-page">
      <div class="route-shell">
        <div class="drawer-head">
          <button
            class="back-button"
            data-i18n="backToRequest"
            onclick="goRequest()"
          ></button>
        </div>
        <h2 id="subDetailTitle"></h2>
        <p id="subDetailMeta" class="muted"></p>
        <div id="subDetail"></div>
      </div>
    </div>
    <div id="loading" class="loading-overlay" aria-live="polite">
      <div class="panel loading-box">
        <div class="spinner"></div>
        <h3 id="loadingStage"></h3>
        <div class="muted" data-i18n="executingQuery"></div>
        <pre id="loadingSQL" class="loading-sql"></pre>
      </div>
    </div>
    <div id="login" class="login">
      <form class="login-card" onsubmit="event.preventDefault(); manualLogin()">
        <p class="login-brand" data-i18n="title"></p>
        <h1 data-i18n="connectTitle"></h1>
        <p class="login-hint" data-i18n="loginHint"></p>
        <label class="login-field"><span data-i18n="apiBase"></span><input id="base" value="" autocomplete="url" spellcheck="false" /></label>
        <label class="login-field"><span data-i18n="managementKey"></span><input id="key" type="password" autocomplete="current-password" /></label>
        <button class="login-submit" type="submit" data-i18n="login"></button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
    </div>
    <script src="external.js"></script>

        var roleKey = {assistant: "assistantRole", tool: "toolRole", compaction: "compactionRole", user: "userRole"}[role];
        var roleLabel = roleKey ? t(roleKey) : role;
        var preview = text.length > 4000 ? text.slice(0, 1400) + "…" : text;
        var id = text.length > 4000 ? retainFullText(text) : "";
        var full = id
          ? "<button onclick=\"expandFullText('" +
            id +
            "',this)\">" +
            t("expandFull") +
            '</button><div class="message-text full-content" style="display:none"></div>'
          : "";
        return (
          '<div class="message-bubble ' +
          esc(role) +
          '"><div class="message-role">' +
          esc(roleLabel + (label ? " · " + label : "")) +
          '</div><div class="message-text">' +
          esc(preview) +
          "</div>" +
          full +
          "</div>"
        );
      }
      function readableMetadata(record) {
        var facets = record.facets || {},
          preferred = [
            "project.name",
            "client",
            "request.kind",
            "auth.id",
            "reasoning.effort",
          ];
        var primary =
          '<div class="facet-badges">' +
          preferred
            .map(function (key) {
              return (facets[key] || [])
                .map(function (value) {
                  return (
                    "<span>" +
                    esc(facetLabel(key)) +
                    ": " +
                    esc(facetValueLabel(key, value)) +
                    "</span>"
                  );
                })
                .join("");
            })
            .join("") +
          "</div>";
        var rows = Object.keys(facets)
          .sort()
          .map(function (key) {
            return (
              "<dt>" +
              esc(facetLabel(key)) +
              "</dt><dd>" +
              esc(
                (facets[key] || [])
                  .map(function (value) {
                    return facetValueLabel(key, value);
                  })
                  .join("、"),
              ) +
              "</dd>"
            );
          })
          .join("");
        return {
          primary: primary,
          details: rows
            ? '<details class="technical-meta"><summary>' +
              t("technicalMetadata") +
              "</summary><dl>" +
              rows +
              "</dl></details>"
            : "",
        };
      }
      function decode64(x) {
        if (!x) return "";
        try {
          return new TextDecoder().decode(
            Uint8Array.from(atob(x), function (c) {
              return c.charCodeAt(0);
            }),
          );
        } catch (e) {
          return "[" + t("binary", { count: x.length }) + "]";
        }
      }
      function goSessions() {
        location.hash = "#/sessions";
      }
      function goSession() {
        location.hash = "#/sessions/" + encodeURIComponent(detailSessionID);
      }
      function goTurn() {
        location.hash =
          "#/sessions/" +
          encodeURIComponent(detailSessionID) +
          "/turns/" +
          encodeURIComponent(currentTurnID);
      }
      function goParentFromRequest() {
        if (currentTurnID) goTurn();
        else goSession();
      }
      function goRequest() {
        var base = "#/sessions/" + encodeURIComponent(detailSessionID);
        if (currentTurnID)
          base += "/turns/" + encodeURIComponent(currentTurnID);
        location.hash =
          base + "/requests/" + encodeURIComponent(currentRequestID);
      }
      function closeDrawer() {
        goSessions();
      }
      async function route() {
        if (
          !session ||
          document.getElementById("login").style.display !== "none"
        )
          return;
        var path = (location.hash || "#/insights")
          .replace(/^#\/?/, "")
          .split("/")
          .filter(Boolean)
          .map(decodeURIComponent);
        var isInsights = !path.length || path[0] === "insights";
        document.getElementById("insightsView").hidden = !isInsights;
        document.getElementById("insightsTab").toggleAttribute("aria-current", isInsights);
        document.getElementById("sessionsTab").toggleAttribute("aria-current", !isInsights);
        document.getElementById(isInsights ? "insightsTab" : "sessionsTab").setAttribute("aria-current", "page");
        if (isInsights) {
          document.getElementById("listView").style.display = "none";
          ["drawer", "requestView", "turnView", "subDetailView"].forEach(function (id) {
            document.getElementById(id).classList.remove("open");
          });
          await loadInsights();
          return;
        }
        insightsRequest++;
        if (path[0] !== "sessions") {
          location.hash = "#/insights";
          return;
        }
        document.getElementById("subDetailView").classList.remove("open");
        if (
          path[1] &&
          path[2] === "turns" &&
          path[3] &&
          path[4] === "requests" &&
          path[5] &&
          path[6] === "raw" &&
          path[7]
        ) {
          currentTurnID = path[3];
          await showRawDetail(path[1], path[5], path[7]);
          return;
        }
        if (
          path[1] &&
          path[2] === "turns" &&
          path[3] &&
          path[4] === "requests" &&
          path[5] &&
          path[6] === "tools" &&
          path[7] != null
        ) {
          currentTurnID = path[3];
          await showToolDetail(path[1], path[5], path[7]);
          return;
        }
        if (
          path[1] &&
          path[2] === "turns" &&
          path[3] &&
          path[4] === "requests" &&
          path[5]
        ) {
          await showRequest(path[1], path[5], path[3]);
          return;
        }
        if (path[1] && path[2] === "turns" && path[3]) {
          await showTurn(path[1], path[3]);
          return;
        }
        if (
          path[1] &&
          path[2] === "requests" &&
          path[3] &&
          path[4] === "raw" &&
          path[5]
        ) {
          currentTurnID = "";
          await showRawDetail(path[1], path[3], path[5]);
          return;
        }
        if (
          path[1] &&
          path[2] === "requests" &&
          path[3] &&
          path[4] === "tools" &&
          path[5] != null
        ) {
          currentTurnID = "";
          await showToolDetail(path[1], path[3], path[5]);
          return;
        }
        if (path[1] && path[2] === "requests" && path[3]) {
          currentTurnID = "";
          await showRequest(path[1], path[3]);
          return;
        }
        if (path[1]) {
          await showSession(path[1]);
          return;
        }
        document.getElementById("drawer").classList.remove("open");
        document.getElementById("requestView").classList.remove("open");
        document.getElementById("turnView").classList.remove("open");
        document.getElementById("subDetailView").classList.remove("open");
        currentTurnID = "";
        document.getElementById("listView").style.display = "grid";
        await loadSessions();
      }
      function displayText(x) {
        var value = String(x == null ? "" : x);
        for (var pass = 0; pass < 4; pass++) {
          var textarea = document.createElement("textarea");
          textarea.innerHTML = value;
          var decoded = textarea.value;
          if (decoded === value) break;
          value = decoded;
        }
        return value;
      }
      function esc(x) {
        return displayText(x).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      applyI18n();
      if (matchMedia("(max-width: 900px)").matches) document.getElementById("filterSidebar").open = false;
      var languageRoot = document.documentElement;
      try {
        if (parent !== window && parent.document.documentElement)
          languageRoot = parent.document.documentElement;
      } catch (ignore) {}
      new MutationObserver(function (mutations) {
        if (
          mutations.some(function (mutation) {
            return mutation.attributeName === "lang";
          })
        ) {
          applyI18n();
          if (
            session &&
            document.getElementById("login").style.display === "none" &&
            document.getElementById("insightsView").hidden
          )
            loadSessions();
        }
      }).observe(languageRoot, {
        attributes: true,
        attributeFilter: ["lang"],
      });

      var a = panelAuth();
      if (a) {
        session = a;
        document.getElementById("base").value = a.base;
        start();
      } else {
        document.getElementById("base").value = location.origin;
      }
      window.addEventListener("hashchange", function () {
        window.scrollTo(0, 0);
        route().catch(function (e) {
          console.error(e);
          hideLoading();
        });
      });
    </script>
  </body>
</html>
