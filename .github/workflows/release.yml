name: ARM64 release

on:
  push:
    tags: ["v*-plana.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: depot-ubuntu-24.04-arm-4
    container: golang:1.24-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zip file python3
      - name: Verify native ARM64 and run real dependency tests
        run: |
          test "$(uname -m)" = aarch64
          go vet ./...
          go test -count=1 ./...
          go test -count=1 -race ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify the plugin and collector
        run: |
          mkdir dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -tags cshared -buildmode=c-shared -o dist/cpa-session-archive.so ./cmd/cpa-session-archive
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o dist/cpa-session-collector-linux-arm64 ./cmd/cpa-session-collector
          file dist/cpa-session-archive.so dist/cpa-session-collector-linux-arm64
          python3 scripts/verify_arm64_release.py
      - name: Package with CLIProxyAPI checksum filenames
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version="0.7.21-plana.1"; fi
          (cd dist && zip -X "cpa-session-archive_${version}_linux_arm64.zip" cpa-session-archive.so)
          (cd dist && sha256sum -- *.zip > checksums.txt && sha256sum -- *.so *.h cpa-session-collector-linux-arm64 *.zip checksums.txt > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: cpa-session-archive-linux-arm64
          path: dist/
          if-no-files-found: error
      - name: Publish verified ARM64 assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
