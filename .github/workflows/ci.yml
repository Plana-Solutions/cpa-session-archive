name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev
      - name: Install isolated ClickHouse test binary
        run: |
          curl -fsSL https://packages.clickhouse.com/tgz/stable/clickhouse-common-static-25.8.33.6-amd64.tgz | tar -xz -C /tmp clickhouse-common-static-25.8.33.6/usr/bin/clickhouse
          mv /tmp/clickhouse-common-static-25.8.33.6/usr/bin/clickhouse /tmp/clickhouse
          /tmp/clickhouse local --query "SELECT version()" | grep -Fx 25.8.33.6
          chmod +x /tmp/clickhouse
          echo "CLICKHOUSE_BINARY=/tmp/clickhouse" >> "$GITHUB_ENV"
      - run: go test ./...
      - run: go test -race ./internal/archive -run '^(TestSerializedExport|TestExportCacheConcurrency)'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:ui
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test:e2e
      - run: CGO_ENABLED=1 go build -tags cshared -buildmode=c-shared -o /tmp/cpa-session-archive.so ./cmd/cpa-session-archive
      - run: CGO_ENABLED=1 go build -o /tmp/cpa-session-collector ./cmd/cpa-session-collector
      - run: CGO_ENABLED=1 go build -o /tmp/cpa-session-import ./cmd/cpa-session-import
      - run: docker build -t cpa-session-archive:test .
